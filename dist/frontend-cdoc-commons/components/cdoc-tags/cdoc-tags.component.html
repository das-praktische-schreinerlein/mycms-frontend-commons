<div *ngIf="tagsKats.length > 0" class="techvaluetable">
    <ng-container *ngFor="let tagColumns of tagsKats">
        <div class='column'>
            <ng-container *ngFor="let tag of tagColumns">
                <div class='entry'>
                    <div class='label'>{{tag.name}}:</div>
                    <div class='value'>
                        {{ tag.keywords.join(', ')}}
                    </div>
                </div>
            </ng-container>
        </div>
    </ng-container>
</div>
